name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-check:
    name: Version, format, lint, and tests
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check release version agreement
        id: version
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import re
          import tomllib
          from pathlib import Path

          cargo = tomllib.loads(Path("Cargo.toml").read_text(encoding="utf-8"))
          cargo_version = cargo["package"]["version"]
          windows = tomllib.loads(Path("tools/windows-launcher/Cargo.toml").read_text(encoding="utf-8"))
          windows_version = windows["package"]["version"]
          script = Path("scripts/install.sh").read_text(encoding="utf-8")
          match = re.search(r"^DEFAULT_VERSION=(?:'([^']+)'|\"([^\"]+)\"|([^\s#]+))", script, re.MULTILINE)
          if not match:
              raise SystemExit("scripts/install.sh has no DEFAULT_VERSION assignment")
          script_version = next(value for value in match.groups() if value is not None)
          version_pattern = r"(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)"
          if not re.fullmatch(version_pattern, cargo_version):
              raise SystemExit(f"Cargo version is not a stable semantic version: {cargo_version}")
          if script_version != cargo_version:
              raise SystemExit(f"Cargo version {cargo_version} does not match install.sh DEFAULT_VERSION {script_version}")
          if windows_version != cargo_version:
              raise SystemExit(f"Windows bridge version {windows_version} does not match Cargo version {cargo_version}")
          if os.environ["GITHUB_EVENT_NAME"] == "push":
              expected_tag = f"v{cargo_version}"
              if os.environ["GITHUB_REF_NAME"] != expected_tag:
                  raise SystemExit(f"tag {os.environ['GITHUB_REF_NAME']} does not match {expected_tag}")
          print(f"version={cargo_version}")
          PY
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +1.88.0 fmt --all -- --check
      - name: Run strict Clippy
        run: cargo +1.88.0 clippy --locked --all-targets -- -D warnings
      - name: Run Linux checks
        run: cargo +1.88.0 test --locked
      - name: Run installer bootstrap tests on Python 3.11
        run: python3.11 -m unittest discover -s tests -p test_install_script.py
      - name: Check Windows bridge formatting
        run: cargo +1.88.0 fmt --manifest-path tools/windows-launcher/Cargo.toml -- --check
      - name: Run Windows bridge tests on Linux
        run: cargo +1.88.0 test --locked --manifest-path tools/windows-launcher/Cargo.toml
      - name: Lint Windows bridge
        run: cargo +1.88.0 clippy --locked --manifest-path tools/windows-launcher/Cargo.toml --all-targets -- -D warnings
      - name: Run release packaging and WinGet generator tests on Python 3.11
        run: python3.11 -m unittest discover -s tests -p test_windows_release.py
      - name: Test Homebrew formula release URL behavior
        run: python3.11 -m unittest discover -s tests -p test_homebrew_generator.py

  build:
    name: Build ${{ matrix.asset }}
    needs: release-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            asset: yashik-linux-x86_64.tar.gz
            host_arch: x86_64
            linux: true
            linker_env: CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: yashik-linux-aarch64.tar.gz
            host_arch: aarch64
            linux: true
            linker_env: CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset: yashik-macos-x86_64.tar.gz
            host_arch: x86_64
            linux: false
            linker_env: none
          - runner: macos-15
            target: aarch64-apple-darwin
            asset: yashik-macos-aarch64.tar.gz
            host_arch: arm64
            linux: false
            linker_env: none
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      TARGET: ${{ matrix.target }}
      RELEASE_VERSION: ${{ needs.release-check.outputs.version }}
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Confirm native runner architecture
        shell: bash
        run: |
          actual="$(uname -m)"
          if [[ "$actual" != "$HOST_ARCH" ]]; then
            echo "Expected native $HOST_ARCH runner, got $actual" >&2
            exit 1
          fi
        env:
          HOST_ARCH: ${{ matrix.host_arch }}
      - name: Install Linux musl toolchain
        if: matrix.linux
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Configure native musl linker
        if: matrix.linux
        run: echo "$LINKER_ENV=musl-gcc" >> "$GITHUB_ENV"
        env:
          LINKER_ENV: ${{ matrix.linker_env }}
      - name: Install pinned Rust target
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup target add --toolchain 1.88.0 "$TARGET"
      - name: Run native target tests
        run: cargo +1.88.0 test --locked --target "$TARGET"
      - name: Build optimized target binary
        run: cargo +1.88.0 build --release --locked --target "$TARGET"
      - name: Verify Linux binary is fully static
        if: matrix.linux
        shell: bash
        run: |
          binary="target/$TARGET/release/yashik"
          if readelf -lW "$binary" | grep -q 'INTERP'; then
            echo "ELF binary contains a dynamic interpreter" >&2
            exit 1
          fi
          if readelf -dW "$binary" 2>/dev/null | grep -q 'NEEDED'; then
            echo "ELF binary has dynamic shared-library dependencies" >&2
            exit 1
          fi
      - name: Package and probe release archive
        shell: bash
        run: |
          mkdir -p dist
          scripts/package-release.sh \
            "target/$TARGET/release/yashik" \
            "dist/$ASSET" \
            "$RELEASE_VERSION"
        env:
          ASSET: ${{ matrix.asset }}
      - name: Run installer against this native release archive
        shell: bash
        run: |
          fixture="$RUNNER_TEMP/release-fixture"
          mock_bin="$RUNNER_TEMP/mock-curl"
          home="$RUNNER_TEMP/installer-home"
          install_dir="$RUNNER_TEMP/installer-bin"
          mkdir -p "$fixture" "$mock_bin" "$home"
          cp "dist/$ASSET" "$fixture/$ASSET"
          python3 - "$fixture/$ASSET" "$fixture/SHA256SUMS" "$ASSET" <<'PY'
          import hashlib
          import sys
          from pathlib import Path

          archive = Path(sys.argv[1])
          manifest = Path(sys.argv[2])
          name = sys.argv[3]
          manifest.write_text(f"{hashlib.sha256(archive.read_bytes()).hexdigest()}  {name}\n", encoding="ascii")
          PY
          cat > "$mock_bin/curl" <<'SH'
          #!/bin/sh
          set -eu
          output=
          url=
          while [ "$#" -gt 0 ]; do
            case "$1" in
              --output)
                [ "$#" -ge 2 ] || exit 2
                output=$2
                shift 2
                continue
                ;;
              https://*) url=$1 ;;
            esac
            shift
          done
          [ -n "$output" ] && [ -n "$url" ] || exit 2
          source="$YASHIK_FIXTURE_DIR/${url##*/}"
          [ -f "$source" ] || exit 22
          cp "$source" "$output"
          SH
          chmod 0755 "$mock_bin/curl"
          output="$(PATH="$mock_bin:$PATH" YASHIK_FIXTURE_DIR="$fixture" HOME="$home" \
            /bin/sh scripts/install.sh --bin-dir "$install_dir")"
          printf '%s\n' "$output"
          test "$("$install_dir/yashik" --version)" = "yashik $RELEASE_VERSION"
          tar -xOzf "dist/$ASSET" yashik | cmp - "$install_dir/yashik"
          repeated="$(PATH="$mock_bin:$PATH" YASHIK_FIXTURE_DIR="$fixture" HOME="$home" \
            /bin/sh scripts/install.sh --bin-dir "$install_dir")"
          printf '%s\n' "$repeated"
          case "$repeated" in *"already installed"*) ;; *) exit 1 ;; esac
        env:
          ASSET: ${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  windows-build:
    name: Build ${{ matrix.asset }}
    needs: release-check
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            architecture: x86_64
            asset: yashik-windows-x86_64.zip
            native_tests: true
          - target: aarch64-pc-windows-msvc
            architecture: aarch64
            asset: yashik-windows-aarch64.zip
            native_tests: false
    env:
      RELEASE_VERSION: ${{ needs.release-check.outputs.version }}
      TARGET: ${{ matrix.target }}
      ARCHITECTURE: ${{ matrix.architecture }}
      ASSET: ${{ matrix.asset }}
      NATIVE_TESTS: ${{ matrix.native_tests }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure MSVC for ARM64 cross-build
        if: matrix.target == 'aarch64-pc-windows-msvc'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64
      - name: Configure MSVC for x64 build
        if: matrix.target == 'x86_64-pc-windows-msvc'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
      - name: Confirm native Windows runner architecture
        if: matrix.native_tests
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne 'AMD64') {
            throw "Expected x64 Windows runner, got $env:PROCESSOR_ARCHITECTURE"
          }
      - name: Install pinned Rust toolchain and target
        shell: pwsh
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { throw 'Unable to install Rust 1.88.0' }
          rustup target add --toolchain 1.88.0 $env:TARGET
          if ($LASTEXITCODE -ne 0) { throw "Unable to install Rust target $env:TARGET" }
      - name: Check Windows bridge formatting
        shell: pwsh
        run: cargo +1.88.0 fmt --manifest-path tools/windows-launcher/Cargo.toml -- --check
      - name: Run native x64 tests and strict Clippy
        if: matrix.native_tests
        shell: pwsh
        run: |
          cargo +1.88.0 test --locked --manifest-path tools/windows-launcher/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Windows bridge tests failed' }
          cargo +1.88.0 clippy --locked --manifest-path tools/windows-launcher/Cargo.toml --all-targets -- -D warnings
      - name: Build optimized Windows bridge
        shell: pwsh
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo +1.88.0 build --release --locked --manifest-path tools/windows-launcher/Cargo.toml --target $env:TARGET
      - name: Check the executable does not require the MSVC redistributable
        shell: pwsh
        run: |
          $binary = "tools/windows-launcher/target/$env:TARGET/release/yashik.exe"
          $dependencies = (& dumpbin.exe /DEPENDENTS $binary 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect PE dependencies for $binary`: $dependencies" }
          if ($dependencies -match '(?i)\b(?:VCRUNTIME|MSVCP)[A-Z0-9_.-]*\.DLL\b') {
            throw "Windows bridge depends on the MSVC redistributable: $dependencies"
          }
          Write-Host "Verified no VCRUNTIME/MSVCP DLL dependency for $env:TARGET."
      - name: Package and probe Windows ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $arguments = @(
            'scripts/package-windows.py',
            '--binary', "tools/windows-launcher/target/$env:TARGET/release/yashik.exe",
            '--output', "dist/$env:ASSET",
            '--version', $env:RELEASE_VERSION,
            '--architecture', $env:ARCHITECTURE
          )
          if ($env:NATIVE_TESTS -eq 'true') { $arguments += '--run-probes' }
          python @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Windows ZIP packaging or verification failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  winget-validation:
    name: Validate WinGet manifests and portable install
    needs:
      - release-check
      - windows-build
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ needs.release-check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: yashik-windows-*.zip
          path: dist
          merge-multiple: true
      - name: Generate exact WinGet manifests from packaged ZIP hashes
        shell: pwsh
        run: |
          $lines = foreach ($file in Get-ChildItem dist/yashik-windows-*.zip | Sort-Object Name) {
            $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -Encoding ascii dist/SHA256SUMS
          $manifestDir = "manifests/a/AlexGladkov/Yashik/$env:RELEASE_VERSION"
          python scripts/generate-winget.py --version $env:RELEASE_VERSION --checksums dist/SHA256SUMS --output-dir $manifestDir
          if ($LASTEXITCODE -ne 0) { throw 'WinGet manifest generation failed' }
          "MANIFEST_DIR=$manifestDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Validate production manifests with WinGet
        shell: pwsh
        run: |
          $winget = Get-Command winget.exe -ErrorAction SilentlyContinue
          if ($null -eq $winget) { throw 'Windows 2025 runner is expected to provide the WinGet client' }
          winget --version
          if ($LASTEXITCODE -ne 0) { throw 'WinGet client could not start' }
          winget validate --manifest $env:MANIFEST_DIR --disable-interactivity
          if ($LASTEXITCODE -ne 0) { throw 'WinGet rejected the production manifests' }
      - name: Install and uninstall x64 portable package through WinGet
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          winget settings --enable LocalManifestFiles
          if ($LASTEXITCODE -ne 0) { throw 'Could not enable local manifest installation for the isolated runner' }
          $fixture = Join-Path $env:RUNNER_TEMP 'yashik-winget-http'
          New-Item -ItemType Directory -Force $fixture | Out-Null
          Copy-Item dist/yashik-windows-*.zip $fixture
          $server = Start-Process -FilePath python -ArgumentList @('-m', 'http.server', '18766', '--bind', '127.0.0.1', '--directory', $fixture) -PassThru -WindowStyle Hidden -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP 'yashik-http.out') -RedirectStandardError (Join-Path $env:RUNNER_TEMP 'yashik-http.err')
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try {
                Invoke-WebRequest -Uri 'http://127.0.0.1:18766/yashik-windows-x86_64.zip' -Method Head -TimeoutSec 2 | Out-Null
                $ready = $true
                break
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw 'Local WinGet fixture server did not become ready' }
            $localManifests = Join-Path $env:RUNNER_TEMP 'yashik-winget-local-manifests'
            New-Item -ItemType Directory -Force $localManifests | Out-Null
            Copy-Item "$env:MANIFEST_DIR/*" $localManifests -Recurse
            $installerManifest = Join-Path $localManifests 'AlexGladkov.Yashik.installer.yaml'
            $installerYaml = Get-Content -Raw $installerManifest
            $installerYaml = $installerYaml.Replace('https://github.com/AlexGladkov/Yashik/releases/download/v' + $env:RELEASE_VERSION, 'http://127.0.0.1:18766')
            Set-Content -Path $installerManifest -Value $installerYaml -Encoding utf8
            winget install --manifest $localManifests --accept-source-agreements --accept-package-agreements --disable-interactivity
            if ($LASTEXITCODE -ne 0) { throw 'WinGet portable installation failed' }
            $links = Join-Path $env:LOCALAPPDATA 'Microsoft/WinGet/Links'
            $alias = Join-Path $links 'yashik.exe'
            if (-not (Test-Path -LiteralPath $alias -PathType Leaf)) { throw 'WinGet did not install the exact yashik.exe portable command alias' }

            $userPath = [Environment]::GetEnvironmentVariable('PATH', 'User')
            $machinePath = [Environment]::GetEnvironmentVariable('PATH', 'Machine')
            $normalizedLinks = [System.IO.Path]::GetFullPath($links).TrimEnd('\')
            $registeredEntries = @($userPath, $machinePath) |
              ForEach-Object { if ($_ ) { $_ -split ';' } } |
              ForEach-Object { [Environment]::ExpandEnvironmentVariables($_.Trim()).TrimEnd('\') }
            if ($registeredEntries -notcontains $normalizedLinks) {
              throw 'WinGet did not persist its portable Links directory in the user or machine PATH'
            }

            $pathEntries = [System.Collections.Generic.List[string]]::new()
            foreach ($pathValue in @($userPath, $machinePath, $env:PATH)) {
              if (-not $pathValue) { continue }
              foreach ($entry in ($pathValue -split ';')) {
                $entry = $entry.Trim()
                if ($entry -and -not $pathEntries.Contains($entry)) { $pathEntries.Add($entry) }
              }
            }
            $env:PATH = $pathEntries -join ';'
            $env:YASHIK_EXPECTED_ALIAS = $alias
            $probe = '$command = Get-Command yashik -CommandType Application -ErrorAction Stop; if ($command.Source -ine $env:YASHIK_EXPECTED_ALIAS) { throw "Bare yashik resolved to unexpected path: $($command.Source)" }; yashik --version'
            $reported = (& pwsh.exe -NoProfile -Command $probe | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { throw 'A fresh PowerShell process could not resolve the bare yashik command alias' }
            if ($reported -ne "yashik $env:RELEASE_VERSION") { throw "Portable alias returned unexpected version: $reported" }
            winget uninstall --name Yashik --exact --disable-interactivity --accept-source-agreements
            if ($LASTEXITCODE -ne 0) { throw 'WinGet portable uninstall failed' }
            if (Test-Path -LiteralPath $alias) { throw 'WinGet left the exact yashik.exe portable command alias after uninstall' }
          } finally {
            if ($null -ne $server -and -not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }

  windows-wsl1-smoke:
    name: Attempt isolated WSL1 bridge smoke
    needs:
      - release-check
      - build
      - windows-build
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      RELEASE_VERSION: ${{ needs.release-check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: yashik-*
          path: dist
          merge-multiple: true
      - name: Import verified official Ubuntu rootfs as an isolated WSL1 distro
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $distro = 'YashikCI'
          $root = Join-Path $env:RUNNER_TEMP 'yashik-wsl1'
          $installLocation = Join-Path $root 'distro'
          $rootfsName = 'ubuntu-base-24.04.5-base-amd64.tar.gz'
          $rootfs = Join-Path $root $rootfsName
          $sums = Join-Path $root 'SHA256SUMS'
          $imported = $false
          New-Item -ItemType Directory -Force $root | Out-Null
          try {
            if ($null -eq (Get-Command wsl.exe -ErrorAction SilentlyContinue)) {
              Write-Host '::notice::WSL1 unavailable on this hosted runner; real WSL smoke remains unverified.'
              exit 0
            }
            $base = 'https://cdimage.ubuntu.com/ubuntu-base/releases/24.04.5/release'
            try {
              Invoke-WebRequest -Uri "$base/SHA256SUMS" -OutFile $sums
              Invoke-WebRequest -Uri "$base/$rootfsName" -OutFile $rootfs
            } catch {
              Write-Host "::notice::Could not download the official Ubuntu Base 24.04.5 WSL1 fixture: $($_.Exception.Message)"
              exit 0
            }
            $line = Get-Content $sums | Where-Object { $_ -match ('\*?' + [regex]::Escape($rootfsName) + '$') }
            if (@($line).Count -ne 1) { throw 'Ubuntu Base SHA256SUMS does not have exactly one rootfs entry' }
            $expected = ($line -split '\s+')[0].ToLowerInvariant()
            $actual = (Get-FileHash -Algorithm SHA256 $rootfs).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw 'Ubuntu Base rootfs SHA-256 did not match its official manifest' }
            Write-Host "Verified official Ubuntu rootfs SHA256 $actual"
            New-Item -ItemType Directory -Force $installLocation | Out-Null
            & wsl.exe --import $distro $installLocation $rootfs --version 1
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::notice::WSL1 import is not usable on this host (exit $LASTEXITCODE); real WSL smoke remains unverified."
              exit 0
            }
            $imported = $true
            $bridgeDir = Join-Path $root 'bridge'
            Expand-Archive dist/yashik-windows-x86_64.zip $bridgeDir
            $bridge = Join-Path $bridgeDir 'yashik.exe'
            $reported = (& $bridge --version | Out-String).Trim()
            if ($reported -ne "yashik $env:RELEASE_VERSION") { throw "Windows bridge reports unexpected version: $reported" }
            $archive = (Resolve-Path dist/yashik-linux-x86_64.tar.gz).Path
            $linuxArchive = (& wsl.exe --distribution $distro --exec wslpath -a -u $archive | Out-String).Trim()
            if ($LASTEXITCODE -ne 0 -or -not $linuxArchive.StartsWith('/')) { throw 'WSL could not convert the Linux archive path' }
            $installScript = 'set -eu; mkdir -p "$HOME/.local/bin"; tar -xOzf "$1" yashik > "$HOME/.local/bin/yashik"; chmod 0755 "$HOME/.local/bin/yashik"'
            & wsl.exe --distribution $distro --exec sh -c $installScript yashik-ci $linuxArchive
            if ($LASTEXITCODE -ne 0) { throw 'Could not install the release Linux binary into the temporary distro' }
            & wsl.exe --set-default $distro
            if ($LASTEXITCODE -ne 0) { throw 'Could not select the temporary WSL distro as default' }
            $doctor = (& $bridge doctor 2>&1 | Out-String)
            if ($LASTEXITCODE -ne 0 -or $doctor -notmatch 'No recorded Yashik installation') { throw "WSL1 doctor smoke failed: $doctor" }
            $manifest = Join-Path $root 'manifest space $ & '' λ.yaml'
            Set-Content -Path $manifest -Encoding utf8 -Value "version: 1`nharnesses: {}"
            & $bridge check $manifest
            if ($LASTEXITCODE -ne 0) { throw 'WSL1 bridge failed to convert and check a Windows manifest path' }
            & $bridge init $manifest
            if ($LASTEXITCODE -ne 0) { throw 'WSL1 bridge init failed' }
            & $bridge doctor
            if ($LASTEXITCODE -ne 0) { throw 'WSL1 bridge doctor failed after init' }
            & $bridge init $manifest
            if ($LASTEXITCODE -ne 0) { throw 'WSL1 bridge rerun failed' }
            Write-Host 'WSL1 bridge smoke passed using an imported official Ubuntu rootfs and the local release artifact.'
          } finally {
            if ($imported) { & wsl.exe --unregister $distro; if ($LASTEXITCODE -ne 0) { Write-Warning 'WSL1 fixture cleanup failed' } }
            Remove-Item -Recurse -Force $root -ErrorAction SilentlyContinue
          }

  brew-test:
    name: Homebrew ${{ matrix.asset }}
    needs:
      - release-check
      - build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            asset: yashik-linux-x86_64.tar.gz
          - runner: ubuntu-24.04-arm
            asset: yashik-linux-aarch64.tar.gz
          - runner: macos-15-intel
            asset: yashik-macos-x86_64.tar.gz
          - runner: macos-15
            asset: yashik-macos-aarch64.tar.gz
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      RELEASE_VERSION: ${{ needs.release-check.outputs.version }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Download all native archives
        uses: actions/download-artifact@v4
        with:
          pattern: yashik-*.tar.gz
          path: dist
          merge-multiple: true
      - name: Verify native release archive exists
        run: test -f "dist/${{ matrix.asset }}"
      - name: Create CI checksum manifest and production formula
        run: |
          cp scripts/install.sh dist/install.sh
          python3 - <<'PY' > dist/SHA256SUMS
          import hashlib
          from pathlib import Path

          names = sorted(["install.sh", *[path.name for path in Path("dist").glob("yashik-*.tar.gz")]])
          for name in names:
              digest = hashlib.sha256((Path("dist") / name).read_bytes()).hexdigest()
              print(f"{digest}  {name}")
          PY
          python3 scripts/generate-homebrew.py \
            --version "$RELEASE_VERSION" \
            --checksums dist/SHA256SUMS \
            --output "$RUNNER_TEMP/production/yashik.rb"
      - name: Install Homebrew on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if ! command -v brew >/dev/null 2>&1; then
            NONINTERACTIVE=1 CI=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi
          echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
          echo /home/linuxbrew/.linuxbrew/sbin >> "$GITHUB_PATH"
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew --version
      - name: Create local tap and audit production formula
        shell: bash
        run: |
          brew tap-new --no-git yashik/ci
          tap_dir="$(brew --repo yashik/ci)"
          mkdir -p "$tap_dir/Formula"
          cp "$RUNNER_TEMP/production/yashik.rb" "$tap_dir/Formula/yashik.rb"
          HOMEBREW_NO_INSTALL_FROM_API=1 brew audit --strict yashik/ci/yashik
      - name: Serve local release fixture
        shell: bash
        run: |
          python3 -m http.server 18765 --bind 127.0.0.1 --directory dist > "$RUNNER_TEMP/yashik-fixture.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/yashik-fixture.pid"
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:18765/SHA256SUMS >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/yashik-fixture.log"
          exit 1
      - name: Install and test formula against native archive
        shell: bash
        run: |
          trap 'kill "$(cat "$RUNNER_TEMP/yashik-fixture.pid")" 2>/dev/null || true' EXIT
          python3 scripts/generate-homebrew.py \
            --version "$RELEASE_VERSION" \
            --checksums dist/SHA256SUMS \
            --base-url http://127.0.0.1:18765 \
            --output "$(brew --repo yashik/ci)/Formula/yashik.rb"
          HOMEBREW_NO_INSTALL_FROM_API=1 brew install --build-from-source yashik/ci/yashik
          HOMEBREW_NO_INSTALL_FROM_API=1 brew test --verbose yashik/ci/yashik
          test "$(brew list --versions yashik/ci/yashik | awk '{print $2}')" = "$RELEASE_VERSION"
          "$(brew --prefix)/bin/yashik" --help >/dev/null

  assemble:
    name: Assemble release assets
    needs:
      - release-check
      - build
      - brew-test
      - windows-build
      - winget-validation
      - windows-wsl1-smoke
    runs-on: ubuntu-24.04
    env:
      RELEASE_VERSION: ${{ needs.release-check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: yashik-*
          path: dist
          merge-multiple: true
      - name: Build checksums and production formula
        shell: bash
        run: |
          cp scripts/install.sh dist/install.sh
          python3 - <<'PY' > dist/SHA256SUMS
          import hashlib
          from pathlib import Path

          names = sorted(
              ["install.sh"]
              + [path.name for path in Path("dist").glob("yashik-*.tar.gz")]
              + [path.name for path in Path("dist").glob("yashik-*.zip")]
          )
          for name in names:
              digest = hashlib.sha256((Path("dist") / name).read_bytes()).hexdigest()
              print(f"{digest}  {name}")
          PY
          python3 - <<'PY' > "$RUNNER_TEMP/SHA256SUMS-unix"
          import hashlib
          from pathlib import Path

          names = sorted(["install.sh", *[path.name for path in Path("dist").glob("yashik-*.tar.gz")]])
          for name in names:
              digest = hashlib.sha256((Path("dist") / name).read_bytes()).hexdigest()
              print(f"{digest}  {name}")
          PY
          python3 scripts/generate-homebrew.py \
            --version "$RELEASE_VERSION" \
            --checksums "$RUNNER_TEMP/SHA256SUMS-unix" \
            --output dist/yashik.rb
          python3 scripts/generate-winget.py \
            --version "$RELEASE_VERSION" \
            --checksums dist/SHA256SUMS \
            --output-dir "dist/manifests/a/AlexGladkov/Yashik/$RELEASE_VERSION"
          python3 - <<'PY'
          import re
          from pathlib import Path
          import tomllib

          cargo = tomllib.loads(Path("Cargo.toml").read_text(encoding="utf-8"))["package"]["version"]
          script = Path("dist/install.sh").read_text(encoding="utf-8")
          version_match = re.search(r"^DEFAULT_VERSION=(?:'([^']+)'|\"([^\"]+)\"|([^\s#]+))", script, re.MULTILINE)
          if not version_match or next(value for value in version_match.groups() if value is not None) != cargo:
              raise SystemExit("release installer DEFAULT_VERSION does not match the Cargo version")
          checksums = Path("dist/SHA256SUMS").read_text(encoding="utf-8").splitlines()
          expected = {
              "install.sh",
              "yashik-linux-x86_64.tar.gz",
              "yashik-linux-aarch64.tar.gz",
              "yashik-macos-x86_64.tar.gz",
              "yashik-macos-aarch64.tar.gz",
              "yashik-windows-x86_64.zip",
              "yashik-windows-aarch64.zip",
          }
          seen = {}
          for line in checksums:
              match = re.fullmatch(r"([0-9a-f]{64})  ([^/\s]+)", line)
              if not match:
                  raise SystemExit(f"malformed checksum line: {line}")
              digest, name = match.groups()
              if name in seen:
                  raise SystemExit(f"duplicate checksum entry: {name}")
              seen[name] = digest
          if set(seen) != expected:
              raise SystemExit("SHA256SUMS must contain exactly the six release archives and install.sh")
          for name in sorted(expected - {"install.sh"}):
              if not (Path("dist") / name).is_file():
                  raise SystemExit(f"missing release archive: {name}")
              import hashlib
              actual = hashlib.sha256((Path("dist") / name).read_bytes()).hexdigest()
              if actual != seen[name]:
                  raise SystemExit(f"SHA256SUMS has the wrong digest for {name}")
          for line in Path("dist/yashik.rb").read_text(encoding="utf-8").splitlines():
              if "releases/download/" in line and f"/v{cargo}/" not in line:
                  raise SystemExit("Homebrew formula URL is not pinned to the Cargo release tag")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: yashik-production-homebrew-formula
          path: dist/yashik.rb
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: yashik-winget-manifests
          path: dist/manifests/a/AlexGladkov/Yashik/${{ env.RELEASE_VERSION }}
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: yashik-release-assets
          path: |
            dist/yashik-linux-x86_64.tar.gz
            dist/yashik-linux-aarch64.tar.gz
            dist/yashik-macos-x86_64.tar.gz
            dist/yashik-macos-aarch64.tar.gz
            dist/yashik-windows-x86_64.zip
            dist/yashik-windows-aarch64.zip
            dist/SHA256SUMS
            dist/install.sh
          if-no-files-found: error
          retention-days: 30

  draft-release:
    name: Create or update draft release
    needs: assemble
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: yashik-release-assets
          path: dist
      - name: Create or update draft without replacing a published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"
            if [[ "$is_draft" != true ]]; then
              echo "Release $RELEASE_TAG is already published; leaving it unchanged."
              exit 0
            fi
            gh release upload "$RELEASE_TAG" \
              dist/yashik-linux-x86_64.tar.gz \
              dist/yashik-linux-aarch64.tar.gz \
              dist/yashik-macos-x86_64.tar.gz \
              dist/yashik-macos-aarch64.tar.gz \
              dist/yashik-windows-x86_64.zip \
              dist/yashik-windows-aarch64.zip \
              dist/SHA256SUMS dist/install.sh --clobber
          else
            gh release create "$RELEASE_TAG" \
              dist/yashik-linux-x86_64.tar.gz \
              dist/yashik-linux-aarch64.tar.gz \
              dist/yashik-macos-x86_64.tar.gz \
              dist/yashik-macos-aarch64.tar.gz \
              dist/yashik-windows-x86_64.zip \
              dist/yashik-windows-aarch64.zip \
              dist/SHA256SUMS dist/install.sh \
              --draft --verify-tag --title "$RELEASE_TAG" \
              --notes "Draft release for Yashik $RELEASE_TAG."
          fi
