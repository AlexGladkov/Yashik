[package]
name = "yashik"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Strict schema validation for a personal AI client environment manifest"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = { package = "yaml_serde", version = "=0.10.7" }

[dev-dependencies]
serde_json = "1"

[[bin]]
name = "yashik"
path = "src/main.rs"
